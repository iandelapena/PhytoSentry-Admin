<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhytoSentry Scan Records</title>

    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="stylesheet" href="css/scan-records.css">
</head>

<body>

    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="brand">
                <img src="assets/images/logo.png" alt="PhytoSentry Logo">
                <span>PhytoSentry</span>
            </div>

            <div class="profile">

                <div class="profile-icon">
                    <span class="profile-head"></span>
                    <span class="profile-body"></span>
                </div>

                <strong>Admin User</strong>
                <span>Administrator</span>

            </div>

            <nav class="sidebar-nav">

                <button class="nav-item" id="dashboardNav">
                    <span class="nav-icon">⌂</span>
                    <span>Dashboard</span>
                </button>

                <button class="nav-item active" id="scanRecordsNav">
                    <span class="nav-icon">▤</span>
                    <span>Scan Records</span>
                </button>

            </nav>

            <button class="logout-button" id="logoutButton">
                <span>Logout</span>
            </button>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- TOP BAR -->
            <div class="top-bar">

                <div class="search-box">

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search by Name, Scan ID, Disease, or Farm..."
                        autocomplete="off"
                    >

                    <span class="search-icon">⌕</span>

                </div>

                <button
                    class="download-button"
                    id="downloadButton"
                    type="button"
                >

                    <span>
                        Download Report
                    </span>

                </button>

            </div>


            <!-- FILTERS -->
            <div class="filters">

                <!-- DATE RANGE -->
                <div class="filter-group">

                    <label>
                        Date Range
                    </label>

                    <div class="date-input-wrapper">

                        <input
                            type="date"
                            id="startDate"
                            aria-label="Start date"
                        >

                        <span class="date-separator">
                            -
                        </span>

                        <input
                            type="date"
                            id="endDate"
                            aria-label="End date"
                        >

                    </div>

                </div>


                <!-- DISEASE FILTER -->
                <div class="filter-group disease-filter">

                    <label>
                        Disease Type
                    </label>

                    <select id="diseaseFilter">

                            <option value="all">
                                All Diseases
                            </option>

                            <option value="brown eye spot">
                                Brown Eye Spot
                            </option>

                            <option value="anthracnose">
                                Anthracnose
                            </option>

                            <option value="cercospora leaf spot">
                                Cercospora Leaf Spot
                            </option>

                            <option value="coffee berry disease">
                                Coffee Berry Disease
                            </option>

                            <option value="coffee leaf rust">
                                Coffee Leaf Rust
                            </option>

                            <option value="healthy leaf">
                                Healthy Leaf
                            </option>

                    </select>

                </div>

            </div>


            <!-- RECORDS CARD -->
            <section class="records-card">

                <div class="table-wrapper">

                    <table id="recordsTable">

                        <thead>

                            <tr>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Farm Name</th>
                                <th>Scan ID</th>
                                <th>Disease Detected</th>
                                <th>Confidence %</th>
                                <th>Date/Time</th>
                                <th>Status</th>
                            </tr>

                        </thead>

                        <!-- FIREBASE RECORDS GO HERE -->
                        <tbody id="recordsTableBody">
                    <!-- Records will be dynamically inserted here -->
                </tbody>

                </table>

                <div
                    class="no-results"
                    id="noResults"
                >
                    No scan records found.
                </div>

                </div>

            </section>

        </main>

    </div>

    <!-- LOGOUT CONFIRMATION -->
    <div class="logout-modal" id="logoutModal">
        <div class="logout-modal-content">

            <h2>Logout</h2>

            <p>Are you sure you want to logout?</p>

            <div class="logout-modal-actions">
                <button class="cancel-logout" id="cancelLogout">
                    Cancel
                </button>

                <button class="confirm-logout" id="confirmLogout">
                    Logout
                </button>
            </div>

        </div>
    </div>
    
    <!-- DOWNLOAD REPORT MODAL -->
<div class="download-modal" id="downloadModal">

    <div class="download-modal-content">

        <h2>Download Report</h2>

        <p>
            Choose the format you want to download.
        </p>

        <div class="download-modal-actions">

            <button
                class="download-option"
                id="downloadCsv"
                type="button"
            >
                Download CSV
            </button>

            <button
                class="download-option"
                id="downloadPdf"
                type="button"
            >
                Download PDF
            </button>

            <button
                class="cancel-download"
                id="cancelDownload"
                type="button"
            >
                Cancel
            </button>

        </div>

    </div>

</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.3/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/5.0.8/jspdf.plugin.autotable.min.js"></script>

<script
    type="module"
    src="js/scan-records.js"
></script>

</body>

</html>
