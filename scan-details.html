<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhytoSentry - Scan Details</title>

    <link rel="stylesheet" href="css/scan-details.css">
</head>

<body>

    <div class="dashboard">

        <!-- =========================================
             SIDEBAR
        ========================================== -->

        <aside class="sidebar">

            <div class="brand">
                <img src="assets/images/logo.png" alt="PhytoSentry Logo">
                <span>PhytoSentry</span>
            </div>


            <div class="profile">

                <div class="profile-icon">
                    <span class="profile-head"></span>
                    <span class="profile-body"></span>
                </div>

                <strong>Admin User</strong>
                <span>Administrator</span>

            </div>


            <nav class="sidebar-nav">

                <button class="nav-item" id="dashboardNav">

                    <span class="nav-icon">⌂</span>
                    <span>Dashboard</span>

                </button>


                <button class="nav-item active" id="scanRecordsNav">

                    <span class="nav-icon">▤</span>
                    <span>Scan Records</span>

                </button>

            </nav>


            <button class="logout-button" id="logoutButton">

                <span class="nav-icon">↪</span>
                <span>Logout</span>

            </button>

        </aside>


        <!-- =========================================
             MAIN CONTENT
        ========================================== -->

        <main class="main-content">

            <!-- PAGE HEADER -->

            <div class="page-header">

                <button class="back-button" id="backButton">
                    <span>←</span>
                </button>

                <h1>Scan Details</h1>

            </div>


            <!-- DETAILS CONTENT -->

            <div class="details-content">

                <!-- SCAN IMAGE -->

                <div class="scan-image-container">

                    <img
                        id="scanImage"
                        src="assets/images/coffee-sample.jpg"
                        alt="Coffee plant scan"
                    >

                </div>


                <!-- INFORMATION -->

                <div class="details-panel">


                    <!-- =========================================
                         SCAN INFORMATION
                    ========================================== -->

                    <section class="detail-section">

                        <h2>Scan Information</h2>


                        <div class="detail-row">

                            <span class="detail-label">
                                Scan ID
                            </span>

                            <span
                                class="detail-value"
                                id="scanId"
                            >
                                SCAN-000124
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-label">
                                Date/Time
                            </span>

                            <span
                                class="detail-value"
                                id="scanDate"
                            >
                                May 18, 2025 10:24 AM
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-label">
                                Status
                            </span>

                            <span
                                class="status completed"
                                id="scanStatus"
                            >
                                Completed
                            </span>

                        </div>

                    </section>


                    <!-- =========================================
                         DETECTION RESULTS
                    ========================================== -->

                    <section class="detail-section">

                        <h2>Detection Results</h2>


                        <div class="detail-row">

                            <span class="detail-label">
                                Disease Detected
                            </span>

                            <span
                                class="detail-value"
                                id="diseaseDetected"
                            >
                                Coffee Leaf Rust
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-label">
                                Confidence
                            </span>

                            <span
                                class="detail-value"
                                id="confidence"
                            >
                                92.4%
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-label">
                                Severity
                            </span>

                            <span
                                class="severity high"
                                id="severity"
                            >
                                High
                            </span>

                        </div>

                    </section>


                    <!-- =========================================
                         FARM DETAILS
                    ========================================== -->

                    <section class="detail-section farm-section">

                        <h2>Farm Details</h2>


                        <!-- FARMER NAME -->

                        <div class="detail-row">

                            <span class="detail-label">
                                Farmer Name
                            </span>

                            <span
                                class="detail-value"
                                id="farmerName"
                            >
                                Juan Dela Cruz
                            </span>

                        </div>


                        <!-- FARM NAME -->

                        <div class="detail-row">

                            <span class="detail-label">
                                Farm Name
                            </span>

                            <span
                                class="detail-value"
                                id="farmName"
                            >
                                PhytoSentry Farm
                            </span>

                        </div>

                    </section>

                </div>

            </div>

        </main>

    </div>


    <script src="js/scan-details.js"></script>

</body>

</html>
